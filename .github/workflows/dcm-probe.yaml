name: dcm-probe

on:
  workflow_dispatch:
    inputs:
      immich_ref:
        description: immich ref to check out (e.g. refs/pull/31040/merge)
        default: main
      repeats:
        description: how many times to run dcm on immich/mobile
        default: '3'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Network reachability of dcm.dev
        run: |
          echo "egress ip: $(curl -sS --max-time 10 https://api.ipify.org)"
          curl -sS -o /dev/null -w 'GET  /                          -> %{http_code} (%{remote_ip})\n' --max-time 15 https://dcm.dev/ || echo "GET / failed: $?"
          for path in verify-oss-v2 verify-free-license verify-ci-v2 activate-free-license; do
            curl -sS -o /dev/null -w "POST /api/license/$path -> %{http_code}\n" --max-time 15 \
              -X POST -H 'content-type: application/json' -d '{}' "https://dcm.dev/api/license/$path" || echo "POST $path failed: $?"
          done

      - name: Install dcm 1.39.1
        run: |
          curl -sSL -o dcm.zip https://github.com/CQLabs/homebrew-dcm/releases/download/1.39.1/dcm-linux-x64-release.zip
          unzip -q dcm.zip -d "$RUNNER_TEMP/dcmdir"
          chmod +x "$RUNNER_TEMP/dcmdir/dcm"
          "$RUNNER_TEMP/dcmdir/dcm" --version

      - name: Checkout immich
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: immich-app/immich
          ref: ${{ inputs.immich_ref }}
          fetch-depth: 1
          persist-credentials: false
          path: immich

      - name: dcm analyze in immich/mobile
        working-directory: immich/mobile
        run: |
          git -C .. log -1 --format='tree: %H %s'
          git -C .. remote -v | head -1
          grep -m1 '^name:' pubspec.yaml
          for i in $(seq 1 ${{ inputs.repeats }}); do
            set +e
            out=$("$RUNNER_TEMP/dcmdir/dcm" analyze lib 2>&1); code=$?
            summary=$(printf '%s' "$out" | grep -m1 -iE 'provided to run on CI|issues|issue' || echo '(no summary line)')
            echo "run $i: exit=$code | $summary"
            sleep 10
          done

      - name: dcm analyze in an unlicensed scratch project (control, expect failure)
        run: |
          mkdir -p "$RUNNER_TEMP/scratch/lib" && cd "$RUNNER_TEMP/scratch"
          git init -q . && git remote add origin https://github.com/someuser/some-random-repo.git
          printf 'name: scratch\nenvironment:\n  sdk: ">=3.5.0 <4.0.0"\n' > pubspec.yaml
          echo 'void main() {}' > lib/main.dart
          set +e
          "$RUNNER_TEMP/dcmdir/dcm" analyze lib 2>&1 | head -3
          echo "exit=${PIPESTATUS[0]}"

name: release-probe
on:
  workflow_dispatch:
  release:
    types: [created, edited, published, released, prereleased, unpublished, deleted]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: report event + runtime latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "=== release event fired ==="
          echo "action           = ${{ github.event.action }}"
          echo "release.tag_name  = ${{ github.event.release.tag_name }}"
          echo "release.draft     = ${{ github.event.release.draft }}"
          echo "release.prerelease= ${{ github.event.release.prerelease }}"
          echo
          echo "=== does the webhook payload carry any 'latest' indicator? ==="
          echo '${{ toJSON(github.event.release) }}' | jq -r 'keys[]' | tr '\n' ' '; echo
          echo '${{ toJSON(github.event.release) }}' | jq 'to_entries[] | select(.key|test("latest";"i"))' || true
          echo "(if nothing above: no latest field in payload)"
          echo
          echo "=== repo latest at job runtime (settled already?) ==="
          RUNTIME_LATEST=$(gh api repos/$REPO/releases/latest --jq .tag_name 2>/dev/null || echo NONE)
          echo "repo /releases/latest = $RUNTIME_LATEST"
          echo "am-I-latest (tag==latest) = $([ "$EVENT_TAG" = "$RUNTIME_LATEST" ] && echo YES || echo NO)"

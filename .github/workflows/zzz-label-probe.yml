name: zzz label probe
on:
  pull_request_target:
    types: [labeled]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          MERGED: ${{ github.event.pull_request.merged }}
          STATE: ${{ github.event.pull_request.state }}
          LABEL: ${{ github.event.label.name }}
        run: echo "fired on PR state=${STATE} merged=${MERGED} label=${LABEL}"

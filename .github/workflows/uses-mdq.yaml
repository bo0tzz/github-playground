on:
  push:
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      
      - name: mdq
        uses: docker://ghcr.io/immich-app/mdq:main@sha256:7ed8dd09ce9f35b6aca5c098a184ab7be3fc8292ee193ccecd9c9ca4cd267da7
        with:
          entrypoint: /bin/sh
          args: -c "/mdq '#' README.md --output json | jq '.items[0].section.title' -r"

      - run: echo ${{ toJSON(steps) }}
